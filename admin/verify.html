<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>smartLAB — Verify Code</title>
    <link rel="icon" href="../favicon.ico">
    <link rel="stylesheet" href="admin.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <div class="verify-icon">📧</div>
                <h1>Verification</h1>
                <p>We sent a 6-digit code to <strong id="displayEmail"></strong></p>
            </div>
            <div id="codeReveal" class="code-reveal-box" style="display:none;">
                <p style="color:#fbbf24;font-size:13px;margin-bottom:6px;">Your verification code:</p>
                <div id="revealedCode" class="revealed-code"></div>
                <p style="color:#94a3b8;font-size:11px;margin-top:8px;">If you didn't receive an email, use the code above.</p>
            </div>
            <form id="verifyForm" onsubmit="return handleVerify(event)">
                <div class="code-inputs" id="codeInputs">
                    <input type="text" maxlength="1" class="code-digit" data-idx="0" inputmode="numeric">
                    <input type="text" maxlength="1" class="code-digit" data-idx="1" inputmode="numeric">
                    <input type="text" maxlength="1" class="code-digit" data-idx="2" inputmode="numeric">
                    <span class="code-sep">—</span>
                    <input type="text" maxlength="1" class="code-digit" data-idx="3" inputmode="numeric">
                    <input type="text" maxlength="1" class="code-digit" data-idx="4" inputmode="numeric">
                    <input type="text" maxlength="1" class="code-digit" data-idx="5" inputmode="numeric">
                </div>
                <div id="verifyError" class="error-msg" style="display:none;"></div>
                <div id="codeHint" class="code-hint"></div>
                <button type="submit" class="btn-auth" id="verifyBtn">
                    <span>Verify & Enter</span>
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                </button>
            </form>
            <div class="auth-footer">
                <a href="login.html">← Back to Login</a>
                <button type="button" class="link-btn" onclick="resendCode()">Resend Code</button>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script src="config.js"></script>
    <script>
        if (sessionStorage.getItem('smartlab_admin_session')) {
            window.location.href = 'panel.html';
        }
        var storedCode = sessionStorage.getItem('smartlab_admin_code');
        var storedEmail = sessionStorage.getItem('smartlab_admin_email');
        var codeTime = parseInt(sessionStorage.getItem('smartlab_admin_code_time') || '0');
        if (!storedCode || !storedEmail) {
            window.location.href = 'login.html';
        }
        document.getElementById('displayEmail').textContent = storedCode ? storedEmail : '';
        document.getElementById('codeHint').textContent = storedCode ? ('Hint: ' + storedCode.substring(0, 2) + '\u2022\u2022\u2022\u2022') : '';

        function revealCode(code) {
            var box = document.getElementById('codeReveal');
            var el = document.getElementById('revealedCode');
            if (box && el && code) {
                el.textContent = code;
                box.style.display = 'block';
            }
        }

        function trySendEmail(code, email) {
            var cfg = ADMIN_CONFIG.emailjs || {};
            if (!cfg.publicKey || !cfg.serviceId || !cfg.templateId) {
                revealCode(code);
                return;
            }
            try {
                emailjs.init({ publicKey: cfg.publicKey });
                emailjs.send(cfg.serviceId, cfg.templateId, {
                    to_email: email,
                    code: code,
                    subject: 'smartLAB Admin Verification Code'
                }).then(function() {
                    console.log('[smartLAB] Email sent successfully');
                }).catch(function(err) {
                    console.warn('[smartLAB] Email failed:', err);
                    revealCode(code);
                });
            } catch(e) {
                console.warn('[smartLAB] EmailJS error:', e);
                revealCode(code);
            }
        }

        if (storedCode) {
            trySendEmail(storedCode, storedEmail);
        }

        var digits = document.querySelectorAll('.code-digit');
        digits.forEach(function(d, i) {
            d.addEventListener('input', function() {
                if (this.value.length === 1 && i < 5) {
                    digits[i + 1].focus();
                }
            });
            d.addEventListener('keydown', function(e) {
                if (e.key === 'Backspace' && !this.value && i > 0) {
                    digits[i - 1].focus();
                }
            });
            d.addEventListener('paste', function(e) {
                e.preventDefault();
                var paste = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '');
                for (var j = 0; j < Math.min(paste.length, 6); j++) {
                    digits[j].value = paste[j];
                }
                if (paste.length >= 6) digits[5].focus();
            });
        });
        digits[0].focus();
        function handleVerify(e) {
            e.preventDefault();
            var entered = '';
            digits.forEach(function(d) { entered += d.value; });
            var errEl = document.getElementById('verifyError');
            var btn = document.getElementById('verifyBtn');
            errEl.style.display = 'none';
            if (entered.length < 6) {
                errEl.textContent = 'Please enter all 6 digits';
                errEl.style.display = 'block';
                return false;
            }
            if (Date.now() - codeTime > 5 * 60 * 1000) {
                errEl.textContent = 'Code expired. Please resend.';
                errEl.style.display = 'block';
                return false;
            }
            if (entered !== storedCode) {
                errEl.textContent = 'Invalid verification code';
                errEl.style.display = 'block';
                digits.forEach(function(d) { d.value = ''; });
                digits[0].focus();
                return false;
            }
            btn.innerHTML = '<span>Verified!</span><div class="spinner"></div>';
            btn.disabled = true;
            var session = {
                email: storedEmail,
                loginTime: Date.now(),
                expires: Date.now() + ADMIN_CONFIG.sessionTimeout
            };
            sessionStorage.setItem('smartlab_admin_session', JSON.stringify(session));
            sessionStorage.removeItem('smartlab_admin_code');
            sessionStorage.removeItem('smartlab_admin_code_time');
            setTimeout(function() {
                window.location.href = 'panel.html';
            }, 800);
            return false;
        }
        function resendCode() {
            var code = '';
            for (var i = 0; i < ADMIN_CONFIG.verificationCodeLength; i++) {
                code += Math.floor(Math.random() * 10);
            }
            sessionStorage.setItem('smartlab_admin_code', code);
            sessionStorage.setItem('smartlab_admin_code_time', Date.now().toString());
            document.getElementById('codeHint').textContent = 'Hint: ' + code.substring(0, 2) + '\u2022\u2022\u2022\u2022';
            document.getElementById('revealedCode').textContent = code;
            digits.forEach(function(d) { d.value = ''; });
            digits[0].focus();
            trySendEmail(code, storedEmail);
            var errEl = document.getElementById('verifyError');
            errEl.textContent = 'New code sent! Check your email or the code below.';
            errEl.style.display = 'block';
            errEl.style.color = '#10b981';
            setTimeout(function() { errEl.style.display = 'none'; errEl.style.color = ''; }, 3000);
        }
    </script>
</body>
</html>
