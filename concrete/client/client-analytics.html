<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>smartLAB — My Projects</title>
    <link rel="icon" href="../favicon.ico">
    <link rel="stylesheet" href="client-common.css">
</head>
<body>
    <div id="header-placeholder"></div>

    <div class="page">
        <a href="../concrete.html" class="back-link">
            <svg viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            <span data-i18n="Back to Concrete">Back to Concrete Testing</span>
        </a>

        <h1 class="page-title" data-i18n="My Projects">My <span>Projects</span></h1>
        <p class="page-sub" data-i18n="Projects desc">Manage your concrete projects, track progress, and access test data</p>

        <div class="section">
            <div class="section-title"><span class="st-icon">📁</span> <span data-i18n="Active Projects">Active Projects</span></div>
            <div class="card-grid" id="activeProjectsGrid">
                <!-- Injected by JS -->
            </div>
        </div>

        <div class="section">
            <div class="section-title"><span class="st-icon">✅</span> <span data-i18n="Completed Projects">Completed Projects</span></div>
            <div class="card-grid" id="completedProjectsGrid">
                <!-- Injected by JS -->
            </div>
        </div>

        <div class="section">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                <div class="section-title" style="margin:0;"><span class="st-icon">➕</span> <span data-i18n="Create New Project">Create New Project</span></div>
                <button class="btn-lg btn-primary" onclick="openCreateModal()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
                    <span data-i18n="New Project">New Project</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Create Project Modal -->
    <div id="createModal" class="modal" style="display:none;">
        <div class="modal-overlay" onclick="closeCreateModal()"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h3 data-i18n="New Project">New Project</h3>
                <button class="modal-close" onclick="closeCreateModal()">×</button>
            </div>
            <form id="createProjectForm">
                <div class="form-group">
                    <label data-i18n="Project Name">Project Name</label>
                    <input type="text" id="projectName" required placeholder="e.g. High-Rise Tower - Floor 40">
                </div>
                <div class="form-group">
                    <label data-i18n="Location">Location</label>
                    <input type="text" id="projectLocation" placeholder="e.g. Downtown - Zone A, Building 12">
                </div>
                <div class="form-group">
                    <label data-i18n="Client">Client</label>
                    <input type="text" id="projectClient" placeholder="e.g. Apex Construction Group">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label data-i18n="Start Date">Start Date</label>
                        <input type="date" id="projectStart">
                    </div>
                    <div class="form-group">
                        <label data-i18n="Expected End">Expected End</label>
                        <input type="date" id="projectEnd">
                    </div>
                </div>
                <div class="form-group">
                    <label data-i18n="Tests Required">Tests Required</label>
                    <div class="test-checkboxes" id="testCheckboxes">
                        <!-- Injected by JS -->
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-sm btn-secondary" onclick="closeCreateModal()" data-i18n="Cancel">Cancel</button>
                    <button type="submit" class="btn-sm btn-primary" data-i18n="Create Project">Create Project</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        var projects = JSON.parse(localStorage.getItem('concrete_projects') || '[]');
        var lang = localStorage.getItem('smartlab_lang') || 'en';

        var testTypes = [
            { id: 'compressive', name: 'Compressive Strength', icon: '🧱' },
            { id: 'slump', name: 'Slump Test', icon: '🪣' },
            { id: 'air', name: 'Air Content', icon: '💨' },
            { id: 'density', name: 'Unit Weight', icon: '⚖️' },
            { id: 'temperature', name: 'Temperature', icon: '🌡️' },
            { id: 'cylinders', name: 'Cylinder Prep', icon: '🔩' }
        ];

        function renderProjects() {
            var active = projects.filter(function(p) { return p.status === 'active'; });
            var completed = projects.filter(function(p) { return p.status === 'completed'; });

            renderGrid('activeProjectsGrid', active, true);
            renderGrid('completedProjectsGrid', completed, false);

            if (active.length === 0) {
                document.getElementById('activeProjectsGrid').innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><div class="icon">📁</div><h3 data-i18n="No Active Projects">No Active Projects</h3><p data-i18n="Start your first project">Create your first concrete project to begin tracking tests and progress.</p></div>';
            }
            if (completed.length === 0) {
                document.getElementById('completedProjectsGrid').innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><div class="icon">✅</div><h3 data-i18n="No Completed Projects">No Completed Projects</h3><p data-i18n="Completed will appear here">Finished projects will appear here with full test reports.</p></div>';
            }
        }

        function renderGrid(gridId, list, showActions) {
            var grid = document.getElementById(gridId);
            if (!grid) return;
            if (list.length === 0) { grid.innerHTML = ''; return; }
            grid.innerHTML = list.map(function(p) {
                var testsHtml = (p.tests || []).map(function(t) {
                    var tt = testTypes.find(function(x) { return x.id === t; });
                    return '<span class="test-tag">' + (tt ? tt.icon + ' ' + tt.name : t) + '</span>';
                }).join('');
                var statusClass = p.status === 'active' ? 'status-active' : p.status === 'pending' ? 'status-pending' : 'status-completed';
                var statusText = p.status === 'active' ? (lang==='ar'?'نشط':'Active') : p.status === 'pending' ? (lang==='ar'?'قيد الانتظار':'Pending') : (lang==='ar'?'مكتمل':'Completed');
                return '<div class="project-card" onclick="openProject(\'' + p.id + '\')">' +
                    '<div class="project-header">' +
                        '<span class="project-name">' + p.name + '</span>' +
                        '<span class="project-status ' + statusClass + '">' + statusText + '</span>' +
                    '</div>' +
                    '<div class="project-meta">' +
                        '<span>📍 ' + (p.location || '-') + '</span>' +
                        '<span>🏢 ' + (p.client || '-') + '</span>' +
                        '<span>📅 ' + (p.startDate || '') + ' → ' + (p.endDate || '') + '</span>' +
                    '</div>' +
                    '<div class="project-tests">' + testsHtml + '</div>' +
                    (showActions ? '<div class="project-actions">' +
                        '<button class="btn-sm btn-primary" onclick="event.stopPropagation(); openProject(\'' + p.id + '\')" data-i18n="Open">Open</button>' +
                        '<button class="btn-sm btn-secondary" onclick="event.stopPropagation(); duplicateProject(\'' + p.id + '\')" data-i18n="Duplicate">Duplicate</button>' +
                    '</div>' : '') +
                '</div>';
            }).join('');
        }

        function openCreateModal() {
            document.getElementById('testCheckboxes').innerHTML = testTypes.map(function(t) {
                return '<label class="test-checkbox"><input type="checkbox" name="tests" value="' + t.id + '"> ' + t.icon + ' ' + t.name + '</label>';
            }).join('');
            document.getElementById('createModal').style.display = 'block';
            setTimeout(function() { document.getElementById('projectName').focus(); }, 100);
        }

        function closeCreateModal() {
            document.getElementById('createModal').style.display = 'none';
            document.getElementById('createProjectForm').reset();
        }

        document.getElementById('createProjectForm').addEventListener('submit', function(e) {
            e.preventDefault();
            var tests = Array.from(document.querySelectorAll('#testCheckboxes input:checked')).map(function(cb) { return cb.value; });
            var project = {
                id: 'PRJ-' + Date.now().toString(36).toUpperCase(),
                name: document.getElementById('projectName').value,
                location: document.getElementById('projectLocation').value,
                client: document.getElementById('projectClient').value,
                startDate: document.getElementById('projectStart').value,
                endDate: document.getElementId('projectEnd').value,
                tests: tests,
                status: 'active',
                createdAt: new Date().toISOString()
            };
            projects.unshift(project);
            localStorage.setItem('concrete_projects', JSON.stringify(projects));
            closeCreateModal();
            renderProjects();
        });

        function openProject(id) {
            localStorage.setItem('currentProjectId', id);
            window.location.href = 'client-reports.html?project=' + id;
        }

        function duplicateProject(id) {
            event.stopPropagation();
            var p = projects.find(function(x) { return x.id === id; });
            if (!p) return;
            var np = { ...p, id: 'PRJ-' + Date.now().toString(36).toUpperCase(), name: p.name + ' (Copy)', status: 'active', createdAt: new Date().toISOString() };
            projects.unshift(np);
            localStorage.setItem('concrete_projects', JSON.stringify(projects));
            renderProjects();
        }

        // Language toggle
        document.getElementById('langToggle').addEventListener('click', function() {
            lang = lang === 'en' ? 'ar' : 'en';
            localStorage.setItem('smartlab_lang', lang);
            this.innerHTML = '<span class="lang-dot"></span> ' + lang.toUpperCase();
            renderProjects();
        });
        document.getElementById('langToggle').innerHTML = '<span class="lang-dot"></span> ' + lang.toUpperCase();

        // Init
        renderProjects();
    </script>
    <script>
        window.translations = {
            'en': {
                'Back to Concrete': 'Back to Concrete Testing',
                'My Projects': 'My <span>Projects</span>',
                'Projects desc': 'Manage your concrete projects, track progress, and access test data',
                'Active Projects': 'Active Projects',
                'Completed Projects': 'Completed Projects',
                'Create New Project': 'Create New Project',
                'New Project': 'New Project',
                'Project Name': 'Project Name',
                'Location': 'Location',
                'Client': 'Client',
                'Start Date': 'Start Date',
                'Expected End': 'Expected End',
                'Tests Required': 'Tests Required',
                'Cancel': 'Cancel',
                'Create Project': 'Create Project',
                'No Active Projects': 'No Active Projects',
                'Start your first project': 'Create your first concrete project to begin tracking tests and progress.',
                'No Completed Projects': 'No Completed Projects',
                'Completed will appear here': 'Finished projects will appear here with full test reports.',
                'Open': 'Open',
                'Duplicate': 'Duplicate',
                'Concrete Testing': 'Concrete Testing',
                'Tests': 'Tests', 'Design': 'Design'
            },
            'ar': {
                'Back to Concrete': 'العودة إلى اختبارات الخرسانة',
                'My Projects': 'مشاريعي <span>الخاصة</span>',
                'Projects desc': 'إدارة مشاريع الخرسانة، تتبع التقدم، والوصول لبيانات الاختبارات',
                'Active Projects': 'مشاريع نشطة',
                'Completed Projects': 'مشاريع مكتملة',
                'Create New Project': 'إنشاء مشروع جديد',
                'New Project': 'مشروع جديد',
                'Project Name': 'اسم المشروع',
                'Location': 'الموقع',
                'Client': 'العميل',
                'Start Date': 'تاريخ البدء',
                'Expected End': 'التاريخ المتوقع للانتهاء',
                'Tests Required': 'الاختبارات المطلوبة',
                'Cancel': 'إلغاء',
                'Create Project': 'إنشاء المشروع',
                'No Active Projects': 'لا توجد مشاريع نشطة',
                'Start your first project': 'أنشئ أول مشروع خرسانة لبدء تتبع الاختبارات والتقدم.',
                'No Completed Projects': 'لا توجد مشاريع مكتملة',
                'Completed will appear here': 'ستظهر المشاريع المنجزة هنا مع تقارير الاختبارات الكاملة.',
                'Open': 'فتح',
                'Duplicate': 'نسخ',
                'Concrete Testing': 'اختبارات <span>الخرسانة</span>',
                'Tests': 'الاختبارات', 'Design': 'التصميم'
            }
        };
    </script>

    <div id="footer-placeholder"></div>

    <script src="../../components.js"></script>
</body>
</html>
