        <div class="section-tabs">
            <button class="section-tab active" onclick="switchTab('tests', event)"><span data-i18n="Tests">Tests</span></button>
            <button class="section-tab" onclick="switchTab('design', event)"><span data-i18n="Design">Design</span></button>
            <button class="section-tab" onclick="switchTab('library', event)"><span data-i18n="Library">Library</span></button>
            <button class="section-tab" onclick="switchTab('client', event)"><span data-i18n="Client Space">Client Space</span></button>
        </div>

        <!-- ===== TESTS ===== -->
        <section class="vhalf active" id="panel-tests">
            <h2 data-i18n="Tests">Tests</h2>
            <div class="card-grid design-grid"></div>
        </section>

        <!-- ===== DESIGN ===== -->
        <section class="vhalf" id="panel-design">

        <!-- ===== LIBRARY ===== -->

            <div class="card-grid design-grid"></div>

        <!-- ===== CLIENT ===== -->
        <section class="vhalf" id="panel-client">
            <h2 data-i18n="Client Space">Client Space</h2>
            <div class="card-grid design-grid"></div>
        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script>
        function switchTab(tabName, event) {
            document.querySelectorAll('.vhalf').forEach(section => {
                section.classList.remove('active');
                section.style.display = 'none';
            });
            document.querySelectorAll('.section-tab').forEach(btn => {
                btn.classList.remove('active');
            });
            const activeSection = document.getElementById('panel-' + tabName);
            if (activeSection) {
                activeSection.classList.add('active');
                activeSection.style.display = 'block';
            }
            if (event && event.currentTarget) {
                event.currentTarget.classList.add('active');
            }
        }
    </script>
