<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>smartLAB — Concrete Standards Library</title>
    <link rel="icon" href="../../favicon.ico">
    <link rel="stylesheet" href="../../concrete/concrete.css">
    <style>
        body { color-scheme: dark; }
        .lib-hero { background: linear-gradient(135deg, rgba(248,113,113,0.08), rgba(239,68,68,0.06), rgba(168,85,247,0.05)); border: 1px solid var(--border-glass); border-radius: var(--radius-md); padding: 32px; margin-bottom: 24px; position: relative; overflow: hidden; }
        .lib-hero::before { content: ''; position: absolute; top: -50%; right: -20%; width: 400px; height: 400px; background: radial-gradient(circle, rgba(248,113,113,0.08) 0%, transparent 70%); pointer-events: none; }
        .lib-hero-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; flex-wrap: wrap; position: relative; z-index: 1; }
        .lib-hero-text { flex: 1; min-width: 280px; }
        .lib-hero-text h1 { font-size: 28px; font-weight: 800; color: var(--text-primary); margin-bottom: 8px; letter-spacing: -0.5px; }
        .lib-hero-text h1 span { color: var(--accent-red); }
        .lib-hero-text p { font-size: 13px; color: var(--text-muted); line-height: 1.6; max-width: 500px; }
        .lib-stats { display: flex; gap: 16px; flex-shrink: 0; }
        .lib-stat { text-align: center; padding: 12px 20px; background: rgba(15,23,42,0.5); border: 1px solid var(--border-glass); border-radius: var(--radius-sm); }
        .lib-stat-num { font-size: 24px; font-weight: 800; color: var(--accent-red); line-height: 1; }
        .lib-stat-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 4px; }
        .lib-back { display: inline-flex; align-items: center; gap: 6px; color: var(--accent-red); font-size: 12px; font-weight: 600; text-decoration: none; margin-bottom: 16px; transition: all 0.2s; }
        .lib-back:hover { color: #fca5a5; transform: translateX(-2px); }
        .lib-toolbar { display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap; }
        .lib-search { flex: 1; min-width: 240px; padding: 12px 16px; background: rgba(15,23,42,0.6); border: 1px solid var(--border-glass); border-radius: var(--radius-sm); color: var(--text-primary); font-size: 13px; outline: none; transition: all 0.2s; }
        .lib-search:focus { border-color: var(--accent-red); box-shadow: 0 0 0 3px rgba(248,113,113,0.1); }
        .lib-search::placeholder { color: var(--text-muted); }
        .filter-chips { display: flex; gap: 6px; flex-wrap: wrap; }
        .chip { padding: 7px 14px; border-radius: 20px; font-size: 11px; font-weight: 600; cursor: pointer; border: 1px solid var(--border-glass); background: rgba(15,23,42,0.4); color: var(--text-muted); transition: all 0.2s; user-select: none; }
        .chip:hover { border-color: rgba(248,113,113,0.4); color: var(--text-primary); }
        .chip.active { background: rgba(248,113,113,0.15); border-color: var(--accent-red); color: var(--accent-red); }
        .std-count { font-size: 12px; color: var(--text-muted); margin-bottom: 16px; display: flex; align-items: center; gap: 6px; }
        .std-count strong { color: var(--accent-red); }
        .std-count .count-bar { flex: 1; height: 2px; background: rgba(255,255,255,0.06); border-radius: 2px; overflow: hidden; }
        .std-count .count-fill { height: 100%; background: linear-gradient(90deg, var(--accent-red), var(--accent-blue)); border-radius: 2px; transition: width 0.4s ease; }
        .std-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
        .std-card { background: rgba(15,23,42,0.45); border: 1px solid var(--border-glass); border-radius: var(--radius-md); padding: 0; transition: all 0.25s ease; overflow: hidden; position: relative; }
        .std-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; opacity: 0; transition: opacity 0.25s; }
        .std-card:hover { border-color: rgba(248,113,113,0.25); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
        .std-card:hover::before { opacity: 1; }
        .std-card[data-org="aci"]::before { background: linear-gradient(90deg, var(--accent-red), #dc2626); }
        .std-card[data-org="astm"]::before { background: linear-gradient(90deg, var(--accent-emerald), #34d399); }
        .std-card[data-org="bs"]::before { background: linear-gradient(90deg, #a855f7, #c084fc); }
        .std-card[data-org="ecp"]::before { background: linear-gradient(90deg, var(--accent-gold), var(--accent-amber)); }
        .std-card[data-org="aashto"]::before { background: linear-gradient(90deg, var(--accent-blue), #6366f1); }
        .std-card-top { padding: 16px 16px 12px; display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
        .std-code-group { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
        .std-code { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 14px; font-weight: 700; color: var(--accent-red); line-height: 1.2; }
        .std-title { font-size: 12px; font-weight: 500; color: var(--text-secondary); line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .std-org { font-size: 9px; font-weight: 700; padding: 3px 8px; border-radius: 10px; text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; flex-shrink: 0; }
        .org-aci { background: rgba(248,113,113,0.15); color: var(--accent-red); }
        .org-astm { background: rgba(16,185,129,0.15); color: var(--accent-emerald); }
        .org-bs { background: rgba(168,85,247,0.15); color: #a855f7; }
        .org-ecp { background: rgba(245,158,11,0.15); color: var(--accent-gold); }
        .org-aashto { background: rgba(59,130,246,0.15); color: var(--accent-blue); }
        .std-card-body { padding: 0 16px 14px; }
        .std-desc { font-size: 11px; color: var(--text-muted); line-height: 1.6; margin-bottom: 10px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .std-tags { display: flex; gap: 4px; flex-wrap: wrap; }
        .std-tag { font-size: 9px; padding: 3px 8px; border-radius: 10px; background: rgba(255,255,255,0.04); color: var(--text-muted); border: 1px solid rgba(255,255,255,0.05); transition: all 0.2s; }
        .std-card:hover .std-tag { background: rgba(248,113,113,0.06); border-color: rgba(248,113,113,0.12); color: var(--text-secondary); }
        .std-card-year { position: absolute; bottom: 12px; right: 14px; font-size: 9px; color: var(--text-muted); opacity: 0.5; font-weight: 500; }
        .empty-state { text-align: center; padding: 80px 20px; color: var(--text-muted); }
        .empty-state .empty-icon { font-size: 56px; margin-bottom: 16px; opacity: 0.6; }
        .empty-state .empty-text { font-size: 14px; font-weight: 500; margin-bottom: 6px; }
        .empty-state .empty-hint { font-size: 12px; color: var(--text-muted); opacity: 0.7; }
        @media (max-width: 700px) { .std-grid { grid-template-columns: 1fr; } .lib-toolbar { flex-direction: column; } .lib-hero { padding: 24px 18px; } .lib-hero-top { flex-direction: column; } .lib-stats { width: 100%; justify-content: space-between; } .lib-stat { flex: 1; } }
    </style>
</head>
<body>
    <div id="header-placeholder"></div>
    <main class="page">
        <a href="../concrete.html" class="lib-back">← Back to Concrete Testing</a>
        <div class="lib-hero">
            <div class="lib-hero-top">
                <div class="lib-hero-text">
                    <h1>Concrete <span>Standards</span></h1>
                    <p>ACI, ASTM, BS & ECP standards for concrete testing, mix design, and construction</p>
                </div>
                <div class="lib-stats" id="libStats"></div>
            </div>
        </div>
        <div class="lib-toolbar">
            <input type="text" class="lib-search" id="searchInput" placeholder="Search by code, title, or keyword..." oninput="filterStandards()">
            <div class="filter-chips" id="filterChips"></div>
        </div>
        <div class="std-count" id="stdCount"></div>
        <div class="std-grid" id="stdGrid"></div>
        <div class="empty-state" id="emptyState" style="display:none;">
            <div class="empty-icon">🔍</div>
            <div class="empty-text">No standards match your search</div>
            <div class="empty-hint">Try different keywords or clear filters</div>
        </div>
    </main>
    <div id="footer-placeholder"></div>
    <script src="../../components.js"></script>
    <script src="library-data.js"></script>
    <script src="library-app.js"></script>
</body>
</html>
