        <div class="section-tabs">
            <button class="section-tab active" onclick="switchTab('tests', event)"><span data-i18n="Tests">Tests</span></button>

            <button class="section-tab" onclick="switchTab('library', event)"><span data-i18n="Library">Library</span></button>

        <section class="vhalf active" id="panel-tests">

        </section>
    </main>

    <div id="footer-placeholder"></div>

    <script>
        function switchTab(tabName, event) {
            document.querySelectorAll('.vhalf').forEach(function(section) {
                section.classList.remove('active');
                section.style.display = 'none';
            });
            document.querySelectorAll('.section-tab').forEach(function(btn) {
                btn.classList.remove('active');
            });
            var activeSection = document.getElementById('panel-' + tabName);
            if (activeSection) {
                activeSection.classList.add('active');
                activeSection.style.display = 'block';
            }
            if (event && event.currentTarget) {
                event.currentTarget.classList.add('active');
            }
        }
    </script>
